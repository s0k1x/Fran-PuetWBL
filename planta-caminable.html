<title>Planta Caminable</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: negro absoluto. Una frase, una acción y una trama de puntos que recuerda a una nube de escaneo. Una sola apariencia, oscura, por decisión. */
:root {
  color-scheme: dark;
  --negro: #000;
  --sup: rgba(16, 16, 16, .78);
  --texto: #ecece8;
  --gris: #85857f;
  --linea: rgba(255, 255, 255, .14);
  --hover: rgba(255, 255, 255, .08);
  --error: #e0806c;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --gx: max(28px, env(safe-area-inset-left, 0px));
  --gr: max(28px, env(safe-area-inset-right, 0px));
  --gt: calc(24px + env(safe-area-inset-top, 0px));
  --gb: calc(24px + env(safe-area-inset-bottom, 0px));
  --curva: cubic-bezier(.2, .7, .2, 1);
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--negro); color: var(--texto); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--negro); }
#vista { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; opacity: 0; transition: opacity 1s var(--curva); }
#app.dentro #vista { opacity: 1; }
#vista.arrastra { cursor: grabbing; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--texto); outline-offset: 3px; }
.dato { font-family: var(--mono); font-size: 11px; color: var(--gris); font-variant-numeric: tabular-nums; }

/* Portada */
#portada { position: absolute; inset: 0; transition: opacity .9s var(--curva); }
#portada.fuera { opacity: 0; pointer-events: none; }
#puntos { position: absolute; inset: 0; width: 100%; height: 100%; }
#marca { position: absolute; left: var(--gx); top: var(--gt); font-size: 13px; color: var(--texto); letter-spacing: .01em; }
#formatos { position: absolute; right: var(--gr); top: var(--gt); text-align: right; max-width: 46%; line-height: 1.7; }
#centro { position: absolute; left: var(--gx); bottom: calc(var(--gb) + 8px); right: var(--gr); display: grid; gap: 30px; justify-items: start; }
#centro h1 { margin: 0; font-weight: 300; font-size: clamp(38px, 6.2vw, 84px); line-height: 1.02; letter-spacing: -.04em; text-wrap: balance; max-width: 13em; }
#acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; width: 100%; }
#cargar { display: inline-flex; align-items: center; min-height: 46px; padding: 0 26px; border: 1px solid var(--texto); border-radius: 999px; font-size: 14px; cursor: pointer; transition: background .3s, color .3s; }
#cargar:hover, #cargar:focus-within { background: var(--texto); color: #000; }
#muestra { color: var(--gris); font-size: 13px; transition: color .2s; }
#muestra:hover { color: var(--texto); }
#progreso { width: min(420px, 100%); display: grid; gap: 10px; }
#barra { height: 1px; background: var(--linea); overflow: hidden; position: relative; }
#barra i { position: absolute; inset: 0; width: 34%; background: var(--texto); animation: desliza 1.5s var(--curva) infinite; }
@keyframes desliza { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
#error { color: var(--error); font-size: 13px; line-height: 1.5; max-width: 60ch; margin: 0; }

/* Recorrido */
#esq { position: absolute; left: var(--gx); top: var(--gt); font-size: 13px; color: #fff; text-shadow: 0 1px 10px rgba(0, 0, 0, .7); transition: opacity .2s; z-index: 2; }
#esq:hover { opacity: .65; }
#dock { position: absolute; left: 50%; bottom: var(--gb); transform: translateX(-50%); display: flex; align-items: center; background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; padding: 4px; max-width: calc(100% - var(--gx) - var(--gr)); box-sizing: border-box; backdrop-filter: blur(18px); z-index: 2; }
#dock > div { display: flex; align-items: center; }
.tool { padding: 9px 12px; border-radius: 10px; font-size: 13px; white-space: nowrap; color: var(--texto); transition: background .15s; }
.tool:hover { background: var(--hover); }
.tool[aria-pressed="true"] { background: var(--texto); color: #000; }
.flecha { width: 34px; height: 36px; border-radius: 10px; font-size: 15px; }
.flecha:hover { background: var(--hover); }
#salaBtn { display: grid; justify-items: start; padding: 3px 12px; border-radius: 10px; min-width: 120px; text-align: left; }
#salaBtn:hover { background: var(--hover); }
#nombre { font-size: 13px; line-height: 1.3; }
.sep { width: 1px; height: 20px; background: var(--linea); margin: 0 6px; }
#hoja { position: absolute; left: 50%; bottom: calc(var(--gb) + 58px); transform: translateX(-50%); width: min(320px, calc(100% - var(--gx) - var(--gr))); max-height: calc(100% - 170px); overflow: auto; box-sizing: border-box; background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; padding: 6px; display: grid; gap: 6px; backdrop-filter: blur(18px); z-index: 2; }
#lista { list-style: none; margin: 0; padding: 0; }
#lista button { width: 100%; display: flex; justify-content: space-between; gap: 12px; padding: 9px 10px; border-radius: 9px; text-align: left; font-size: 13px; }
#lista button:hover { background: var(--hover); }
#lista .actual { font-weight: 500; }
.ajuste { display: grid; gap: 6px; padding: 8px 10px; font-size: 13px; }
.ajuste > span { display: flex; justify-content: space-between; align-items: baseline; }
.ajuste input[type="range"] { width: 100%; accent-color: var(--texto); }
.ajuste input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--linea); border-radius: 8px; background: transparent; }
.fila { display: flex; flex-wrap: wrap; gap: 2px; }
#mini { position: absolute; right: var(--gr); top: var(--gt); width: 168px; height: 168px; background: var(--sup); border: 1px solid var(--linea); box-sizing: border-box; border-radius: 12px; overflow: hidden; backdrop-filter: blur(18px); transition: width .4s var(--curva), height .4s var(--curva), right .4s var(--curva); z-index: 1; }
#mini.grande { width: min(70vh, calc(100% - var(--gx) - var(--gr))); height: min(70vh, calc(100% - 150px)); right: max(var(--gr), calc(50% - 35vh)); z-index: 3; }
#mapa { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
#etiquetas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#etiquetas button { position: absolute; left: 0; top: 0; pointer-events: auto; padding: 5px 10px; border-radius: 999px; background: var(--sup); border: 1px solid var(--linea); font-size: 12px; white-space: nowrap; will-change: transform; }
#etiquetas button:hover { background: var(--texto); color: #000; }
#pista { position: absolute; left: 50%; top: calc(var(--gt) + 2px); transform: translateX(-50%); padding: 7px 12px; border-radius: 999px; background: var(--sup); color: var(--texto); font-size: 12px; white-space: nowrap; pointer-events: none; transition: opacity .8s; z-index: 2; }
#aviso { position: absolute; left: 50%; top: calc(var(--gt) + 42px); transform: translateX(-50%); max-width: min(440px, calc(100% - var(--gx) - var(--gr))); width: max-content; box-sizing: border-box; padding: 9px 13px; border-radius: 10px; background: var(--sup); border: 1px solid var(--linea); font-size: 13px; line-height: 1.4; backdrop-filter: blur(18px); z-index: 5; }
#velo { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .16s linear; z-index: 1; }
#palanca { position: absolute; left: calc(var(--gx) + 2px); bottom: calc(var(--gb) + 70px); width: 104px; height: 104px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .5); background: rgba(0, 0, 0, .18); pointer-events: none; z-index: 1; }
#palanca i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: rgba(255, 255, 255, .78); }
#etiPlanta { position: absolute; left: var(--gx); top: calc(var(--gt) + 26px); color: #fff; font-size: 12px; text-shadow: 0 1px 10px rgba(0, 0, 0, .7); z-index: 2; }
#suelta { position: absolute; inset: 14px; border: 1px solid var(--texto); border-radius: 16px; background: rgba(0, 0, 0, .7); display: grid; place-items: center; font-weight: 300; font-size: 26px; letter-spacing: -.02em; pointer-events: none; z-index: 7; }
@media (max-width: 760px) {
  :root { --gx: max(18px, env(safe-area-inset-left, 0px)); --gr: max(18px, env(safe-area-inset-right, 0px)); }
  #formatos { max-width: 58%; font-size: 10px; }
  #dock { width: calc(100% - var(--gx) - var(--gr)); justify-content: space-between; flex-wrap: wrap; }
  #dock > div { justify-content: space-between; width: 100%; }
  #dock .sep { display: none; }
  #salaBtn { flex: 1; justify-items: center; text-align: center; }
  #herr { justify-content: space-around; border-top: 1px solid var(--linea); padding-top: 3px; margin-top: 3px; }
  #hoja { bottom: calc(var(--gb) + 104px); }
  #mini { width: 104px; height: 104px; }
  #mini.grande { width: calc(100% - var(--gx) - var(--gr)); height: min(60vh, calc(100% - 190px)); right: var(--gr); }
  #palanca { bottom: calc(var(--gb) + 112px); }
  #pista { top: auto; bottom: calc(var(--gb) + 112px); left: auto; right: var(--gr); transform: none; white-space: normal; max-width: 48%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app">
  <canvas id="vista" tabindex="0" aria-label="Vista 3D. Usa W, A, S y D para caminar y arrastra para mirar."></canvas>
  <div id="etiquetas" hidden></div>
  <div id="velo"></div>

  <section id="portada">
    <canvas id="puntos" aria-hidden="true"></canvas>
    <span id="marca">Planta Caminable</span>
    <div id="formatos" class="dato">GLB · GLTF · OBJ · FBX · DAE · PLY · STL · 3DS · 3MF · AMF · PCD · XYZ · ZIP</div>
    <div id="centro">
      <h1>Camina por tu escaneo.</h1>
      <p id="error" hidden></p>
      <div id="acciones">
        <label id="cargar" for="archivo">Cargar escaneo</label>
        <button id="muestra" type="button">Ver casa de muestra</button>
      </div>
      <div id="progreso" hidden>
        <div id="barra"><i></i></div>
        <span id="estado" class="dato">Leyendo archivo</span>
      </div>
    </div>
  </section>

  <button id="esq" type="button" hidden>Planta Caminable</button>
  <span id="etiPlanta" hidden></span>
  <div id="mini" hidden><canvas id="mapa" aria-label="Plano. Pulsa un punto para saltar hasta él."></canvas></div>
  <div id="pista" hidden></div>
  <div id="palanca" hidden><i id="pomo"></i></div>
  <div id="hoja" hidden></div>
  <nav id="dock" hidden aria-label="Recorrido">
    <div id="navSala">
      <button id="ant" class="flecha" type="button" aria-label="Estancia anterior">←</button>
      <button id="salaBtn" type="button"><span id="nombre">—</span><span id="datos" class="dato"></span></button>
      <button id="sig" class="flecha" type="button" aria-label="Estancia siguiente">→</button>
    </div>
    <span class="sep"></span>
    <div id="herr">
      <button id="bPla" class="tool" type="button" aria-pressed="false">Plano</button>
      <button id="bMaq" class="tool" type="button" aria-pressed="false">Maqueta</button>
      <button id="bAju" class="tool" type="button" aria-pressed="false">Ajustes</button>
    </div>
  </nav>
  <div id="aviso" role="status" hidden></div>
  <div id="suelta" hidden>Suelta para cargar</div>
  <input id="archivo" type="file" multiple hidden>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
/* Para dejar un escaneo fijo en la web: publica el archivo junto a la página y rellena esto. */
const CONFIG = { modelUrl: null, modelName: "escaneo", scale: 0, tilt: 0, eye: 1.6, rooms: [], spawn: null };
/* Casa de muestra: una vivienda en torno a un patio. Todo son cajas alineadas a los ejes,
   así el horneado de luz y la página parten exactamente de la misma geometría. */
function crearCasa() {
  const H = 3, T = .18, cajas = [], vidrios = [], curvos = [];
  const MATS = {
    yeso:    { al: [.80, .79, .76], d: 11, uv: 2 },
    techo:   { al: [.84, .84, .82], d: 7, uv: 2 },
    roble:   { al: [.40, .26, .155], d: 26, uv: 2.4 },
    robleM:  { al: [.40, .26, .155], d: 16, uv: 2.4 },
    traver:  { al: [.68, .62, .54], d: 18, uv: 2.4 },
    suelob:  { al: [.60, .56, .50], d: 24, uv: 2.4 },
    grava:   { al: [.60, .58, .55], d: 22, uv: 1.6 },
    negro:   { al: [.035, .035, .035], d: 14 },
    lino:    { al: [.66, .62, .55], d: 18, uv: 1.2 },
    sofa:    { al: [.40, .37, .32], d: 18, uv: 1.2 },
    lino2:   { al: [.20, .20, .19], d: 18, uv: 1.2 },
    blanco:  { al: [.86, .86, .84], d: 18 },
    agua:    { al: [.03, .05, .06], d: 18 },
    espejo:  { al: [.55, .60, .62], d: 10 },
    arte:    { al: [.72, .68, .60], d: 14 },
    luz:     { al: [.9, .9, .9], em: [5, 4.4, 3.6], d: 12 },
    fuera:   { al: [.86, .86, .84], d: .7 }
  };
  const c = (x0, y0, z0, x1, y1, z1, m, op) => cajas.push({ a: [Math.min(x0, x1), Math.min(y0, y1), Math.min(z0, z1)], b: [Math.max(x0, x1), Math.max(y0, y1), Math.max(z0, z1)], m, ...(op || {}) });
  /* Muro con huecos: {a, b, y0, y1, v} desde el origen del muro; v = acristalado */
  function muro(x0, z0, x1, z1, huecos = []) {
    const hz = z0 === z1, L = hz ? x1 - x0 : z1 - z0, t = T / 2;
    const p = (a, b, y0, y1, m, g = t) => hz ? c(x0 + a, y0, z0 - g, x0 + b, y1, z0 + g, m) : c(x0 - g, y0, z0 + a, x0 + g, y1, z0 + b, m);
    let cur = -t;
    for (const h of huecos) {
      const y0 = h.y0 || 0, y1 = h.y1 || 2.72;
      p(cur, h.a, 0, H, "yeso");
      if (y0) p(h.a, h.b, 0, y0, "yeso");
      p(h.a, h.b, y1, H, "yeso");
      if (h.v) {
        const pv = hz ? [x0 + h.a, y0, z0 - .008, x0 + h.b, y1, z0 + .008] : [x0 - .008, y0, z0 + h.a, x0 + .008, y1, z0 + h.b];
        vidrios.push({ a: pv.slice(0, 3), b: pv.slice(3) });
        const g = .03, b = .02;
        p(h.a, h.a + b * 2, y0, y1, "negro", g); p(h.b - b * 2, h.b, y0, y1, "negro", g);
        p(h.a, h.b, y1 - b * 2, y1, "negro", g); p(h.a, h.b, y0, y0 + b * 2, "negro", g);
        const n = Math.max(0, Math.round((h.b - h.a) / 1.9) - 1);
        for (let i = 1; i <= n; i++) { const m = h.a + (h.b - h.a) * i / (n + 1); p(m - b, m + b, y0, y1, "negro", g); }
      }
      cur = h.b;
    }
    p(cur, L + t, 0, H, "yeso");
  }

  /* Exterior y suelos */
  c(-44, -.6, -44, 60, -.03, 57, "fuera", { suelo: true });
  c(0, -.2, 0, 6, 0, 13, "roble");
  c(6, -.2, 0, 16, 0, 4, "roble");
  c(10.5, -.2, 4, 16, 0, 9.5, "roble");
  c(6, -.2, 8, 10.5, 0, 9.5, "roble");
  c(6, -.2, 9.5, 7, 0, 13, "roble");
  c(10, -.2, 9.5, 10.5, 0, 13, "roble");
  c(10.5, -.2, 9.5, 16, 0, 13, "roble");
  c(7, -.2, 9.5, 10, 0, 13, "suelob");
  c(6, -.2, 4, 10.5, 0, 8, "grava");

  /* Muros */
  muro(0, 0, 16, 0, [{ a: .7, b: 5.3, v: 1 }, { a: 7, b: 15, v: 1 }]);
  muro(0, 0, 0, 13, [{ a: 5.3, b: 7.2, v: 1 }]);
  muro(0, 13, 16, 13, [{ a: 1, b: 5, v: 1 }, { a: 8, b: 9, y0: 1.95, y1: 2.65, v: 1 }, { a: 11, b: 15, v: 1 }]);
  muro(16, 0, 16, 13, [{ a: 5, b: 7, v: 1 }]);
  muro(6, 0, 6, 8, [{ a: 1.45, b: 2.55 }, { a: 4.2, b: 5.5, v: 1 }, { a: 5.5, b: 6.6 }, { a: 6.6, b: 7.9, v: 1 }]);
  muro(6, 4, 16, 4, [{ a: .2, b: 4.3, v: 1 }, { a: 7, b: 7.95 }]);
  muro(10.5, 4, 10.5, 8, [{ a: .3, b: 3.7, v: 1 }]);
  muro(0, 8, 16, 8, [{ a: 2.5, b: 3.6 }, { a: 6.2, b: 7.7, v: 1 }, { a: 7.7, b: 8.8 }, { a: 8.8, b: 10.3, v: 1 }, { a: 13, b: 13.95 }]);
  muro(0, 9.5, 16, 9.5, [{ a: 3, b: 3.95 }, { a: 8.05, b: 8.95 }, { a: 12.5, b: 13.45 }]);
  muro(7, 9.5, 7, 13); muro(10, 9.5, 10, 13);

  /* Cubierta alrededor del patio */
  c(-.09, H, -.09, 16.09, H + .3, 4, "techo"); c(-.09, H, 4, 6, H + .3, 8, "techo");
  c(10.5, H, 4, 16.09, H + .3, 8, "techo"); c(-.09, H, 8, 16.09, H + .3, 13.09, "techo");

  /* Salón */
  c(1, 0, 2, 4.8, .012, 5.4, "lino");
  c(1.3, 0, 4.6, 4.1, .1, 5.5, "negro");
  c(1.2, .1, 4.5, 4.2, .3, 5.6, "sofa");
  [[1.21, 2.2], [2.204, 3.2], [3.204, 4.19]].forEach(([a, b]) => { c(a, .3, 4.51, b, .45, 5.33, "sofa"); c(a, .3, 5.334, b, .8, 5.59, "sofa"); });
  c(3.3, .1, 3.6, 4.2, .3, 4.5, "sofa"); c(3.32, .3, 3.62, 4.18, .45, 4.5, "sofa");
  c(1.9, 0, 3, 2.9, .3, 3.7, "traver");
  c(4.7, .08, 2.6, 5.4, .42, 3.3, "lino2"); c(5.2, .42, 2.6, 5.4, .74, 3.3, "lino2"); c(4.8, 0, 2.7, 5.3, .08, 3.2, "negro");
  c(.09, 0, 1.4, .52, H, 4.2, "traver");
  c(.5, .32, 2.3, .53, .92, 3.3, "negro");
  c(3.95, .85, 7.86, 5.75, 2.35, 7.91, "arte", { tex: 0 });

  /* Cocina y comedor */
  c(15.25, 0, .09, 15.91, 2.72, 3.91, "robleM");
  c(11.2, 0, 1.55, 14.2, .92, 2.45, "traver");
  c(7.4, .72, 1.6, 9.7, .76, 2.4, "robleM");
  c(7.6, 0, 1.75, 7.68, .72, 2.25, "negro"); c(9.42, 0, 1.75, 9.5, .72, 2.25, "negro");
  c(8.5, 2.1, 1.98, 8.515, H, 2.02, "negro"); // cable lámpara
  curvos.push({ t: "esfera", p: [8.5, 2.02, 2], r: .14 });

  /* Estudio */
  c(10.85, .71, 4.7, 11.6, .75, 7.3, "robleM");
  c(10.9, 0, 4.8, 10.96, .71, 4.86, "negro"); c(11.5, 0, 4.8, 11.56, .71, 4.86, "negro");
  c(10.9, 0, 7.14, 10.96, .71, 7.2, "negro"); c(11.5, 0, 7.14, 11.56, .71, 7.2, "negro");
  c(11.8, .42, 5.72, 12.26, .47, 6.18, "lino2"); c(12.22, .47, 5.72, 12.26, .84, 6.18, "lino2"); c(12, 0, 5.92, 12.06, .42, 5.98, "negro");
  c(15.35, 0, 4.1, 15.91, .72, 4.9, "robleM");

  /* Galería */
  c(1.2, H - .012, 8.7, 14.8, H, 8.8, "luz");
  [[4.7, 1], [6.3, 2], [10.1, 1]].forEach(([x, i]) => c(x, 1, 9.36, x + .9, 2.2, 9.41, "arte", { tex: i }));

  /* Dormitorio */
  c(.09, 0, 9.6, .2, 1.15, 12.9, "robleM");
  c(.2, 0, 10.2, 2.4, .26, 12, "robleM");
  c(.25, .26, 10.25, 2.35, .5, 11.95, "blanco");
  c(1.5, .5, 10.22, 2.37, .54, 11.98, "lino2");
  c(.2, .5, 10.4, .62, .62, 11.05, "lino"); c(.2, .5, 11.15, .62, .62, 11.8, "lino");
  c(.2, .3, 9.68, .68, .34, 10.1, "robleM"); c(.2, .3, 12.1, .68, .34, 12.52, "robleM");
